# R-CMD-check.yml: run the testthat suite and R CMD check inside the same Nix
# environment used locally (default.nix, generated from default.R via rix).
# Without this job, "CI green" only meant the privacy scan passed.
name: R-CMD-check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  r-tests:
    name: testthat + R CMD check (Nix)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Run testthat suite
        run: |
          nix-shell default.nix --run "Rscript -e 'devtools::test(stop_on_failure = TRUE)'"

      - name: R CMD check
        run: |
          nix-shell default.nix --run "Rscript -e 'rcmdcheck::rcmdcheck(args = \"--no-manual\", error_on = \"error\")'"
