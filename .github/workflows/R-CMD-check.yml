# R-CMD-check.yml: run the testthat suite and R CMD check inside the same Nix
# environment used locally (default.nix, generated from default.R via rix).
# Without this job, "CI green" only meant the privacy scan passed.
#
# Build cost: the rix date in default.nix must be one the rstats-on-nix binary
# cache covers, else the shell is built from source (~26 min per run). The
# rstats-on-nix substituter below serves the binaries; the Nix store cache
# (nix-community/cache-nix-action) keeps what is left between runs, keyed on
# default.nix (the only Nix file; it imports no other). The cache is saved only
# on main and only when the exact key missed. No garbage collection is run: the
# shell has no GC root, so a collection would delete it.
# Every action is pinned to a full commit SHA; the comment gives its version.
name: R-CMD-check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  r-tests:
    name: testthat + R CMD check (Nix)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            extra-substituters = https://rstats-on-nix.cachix.org
            extra-trusted-public-keys = rstats-on-nix.cachix.org-1:vdiiVgocg6WeJrODIqdprZRUrhi1JzhBnXv7aWI6+F0=

      - name: Restore the Nix store cache
        id: nix-cache
        uses: nix-community/cache-nix-action/restore@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('default.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      # Node is in the Nix shell (default.R, system_pkgs). The tests that run the
      # JavaScript app against the R package must not be skipped here: with
      # RALLYR_REQUIRE_NODE a missing Node is an error, not a skip.
      - name: Run testthat suite
        env:
          RALLYR_REQUIRE_NODE: "true"
        run: |
          nix-shell default.nix --run "Rscript -e 'devtools::test(stop_on_failure = TRUE)'"

      - name: R CMD check
        env:
          RALLYR_REQUIRE_NODE: "true"
        run: |
          nix-shell default.nix --run "Rscript -e 'rcmdcheck::rcmdcheck(args = \"--no-manual\", error_on = \"error\")'"

      - name: Save the Nix store cache
        if: github.ref == 'refs/heads/main' && steps.nix-cache.outputs.hit-primary-key != 'true'
        uses: nix-community/cache-nix-action/save@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('default.nix') }}
